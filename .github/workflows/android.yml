name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
      - name: Install dependencies
        run: npm ci
      - name: Test data and farm rules
        run: npm test
      - name: Build and sync game
        run: npm run android:sync
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest assembleDebug --no-daemon --max-workers=2
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "田野来信.apk"
      - name: Sign with fixed Android key when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            test -n "$KEYSTORE_PASSWORD"
            test -n "$KEY_ALIAS"
            key_path="$RUNNER_TEMP/fieldletter-signing.p12"
            trap 'rm -f "$key_path"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_path"
            chmod 600 "$key_path"
            if [ -z "$KEY_PASSWORD" ]; then export KEY_PASSWORD="$KEYSTORE_PASSWORD"; fi
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$key_path" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out fixed.apk "田野来信.apk"
            python scripts/verify-update-apk.py "田野来信.apk" fixed.apk "$ANDROID_HOME/build-tools/35.0.0/apksigner" docs/android-signing-certificate.sha256
            mv fixed.apk "田野来信.apk"
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 田野来信-Android
          path: 田野来信.apk
          if-no-files-found: error
          retention-days: 30
