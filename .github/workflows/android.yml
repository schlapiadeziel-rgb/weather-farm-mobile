name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.31.6"
      - name: Install dependencies
        run: npm ci
      - name: Test data and farm rules
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_next*.py'
      - name: Build and sync game
        run: npm run android:sync
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest assembleDebug --no-daemon --max-workers=2
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "田野来信-新版.apk"
      - name: Sign independent APK when recovery secret is configured
        env:
          NEXT_SIGNING_RECOVERY: ${{ secrets.ANDROID_NEXT_SIGNING_RECOVERY }}
        run: |
          if [ -n "$NEXT_SIGNING_RECOVERY" ]; then
            private_dir=$(mktemp -d "$RUNNER_TEMP/fieldletter-next-signing.XXXXXX")
            trap 'rm -rf "$private_dir"' EXIT
            chmod 700 "$private_dir"
            printf '%s' "$NEXT_SIGNING_RECOVERY" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 --decrypt --output "$private_dir/bundle.tar" signing/fieldletter-next-signing.tar.gpg
            python scripts/restore-next-signing.py "$private_dir/bundle.tar" "$private_dir"
            python scripts/sign-next-apk.py "田野来信-新版.apk" fixed.apk --signing-dir "$private_dir" --sdk "$ANDROID_HOME"
            mv fixed.apk "田野来信-新版.apk"
          else
            echo 'Independent recovery secret not configured; artifact is a build candidate only.'
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 田野来信-新版-Android
          path: 田野来信-新版.apk
          if-no-files-found: error
          retention-days: 30
